<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso · INTERCOL</title><link rel="stylesheet" href="style.css"></head><body><main class="access-page"><section class="access-card"><div class="brand-mark">I</div><span class="eyebrow">CUENTA DE ASESOR</span><h1 id="formTitle">Iniciar sesión</h1><p class="intro">Ingresa con tu usuario y contraseña para entrar a tus notificaciones.</p><div class="mode-switch"><button type="button" class="mode-button active" data-mode="login">Iniciar sesión</button><button type="button" class="mode-button" data-mode="register">Registrarse</button></div><form id="accessForm"><div id="advisorField" hidden><label for="advisor">Asesor</label><input id="advisor" name="advisor" type="text" autocomplete="name" placeholder="Nombre del asesor"></div><label for="username">Nombre de usuario</label><input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" placeholder="Ej. maria.perez" required><label for="password">Contraseña</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Mínimo 6 caracteres" required><button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button></div><button class="submit-button" id="submitButton" type="submit">Iniciar sesión</button><p class="status" id="status" role="status" aria-live="polite"></p></form><p class="privacy-note">Cada cuenta guarda sus propios registros; otras cuentas no pueden verlos.</p></section></main><script src="script.js"></script></body></html>
