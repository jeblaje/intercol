<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retiro de TV · INTERCOL</title><link rel="stylesheet" href="style.css"></head><body><main class="tv-app"><header class="tv-heading"><div><span>PERSONAL · EQUIPOS</span><h1>Retiro de TV</h1><p>Registra el retiro del equipo y mantén el seguimiento del ticket.</p></div><b id="syncStatus">Conectando</b></header><section class="tv-layout"><section class="tv-form card"><small>NUEVO REGISTRO</small><h2 id="formTitle">Agendar retiro de TV</h2><form id="tvForm"><input type="hidden" name="recordId"><label>Nombre<input name="nombre" required></label><label>Cédula<input name="cedula" required></label><label>Estado<select name="estado"><option value="pendiente">Pendiente</option><option value="retirado">Retirado</option><option value="no-retirado">No retirado</option><option value="sin-retirar">Sin retirar · no contesta o no se encuentra</option><option value="cancelado">Cancelado</option></select></label><label>Comentarios<textarea name="comentarios" rows="4"></textarea></label><label>Asesor que creó el ticket<input name="asesorCreador"></label><label>Asesor que autorizó el cambio de equipo<input name="asesorAutoriza"></label><label># Ticket<input name="ticket"></label><div class="actions"><button type="button" id="cancelEdit" hidden>Cancelar</button><button class="primary" id="saveButton">Guardar retiro</button></div><p id="formStatus"></p></form></section><section class="tv-list card"><header><div><small>SEGUIMIENTO</small><h2>Retiros de TV <em id="count">0</em></h2></div><button id="clearSearch" type="button">Limpiar</button></header><div class="search"><input id="search" type="search" placeholder="Buscar por nombre, cédula, ticket o asesor"><select id="filter"><option value="">Todos</option><option value="pendiente">Pendientes</option><option value="retirado">Retirados</option><option value="no-retirado">No retirados</option><option value="sin-retirar">Sin retirar</option><option value="cancelado">Cancelados</option></select></div><div id="list"></div><p id="empty">No hay retiros de TV registrados.</p></section></section></main><script src="script.js"></script></body></html>
